drupal_mock_data_seeder.settings:
  type: config_object
  label: 'Drupal Mock Data Seeder settings'
  mapping:
    enabled:
      type: boolean
      label: 'Enable seeder in this environment'
    safeguards:
      type: mapping
      label: 'Safety guard settings'
      mapping:
        max_count:
          type: integer
          label: 'Maximum node count per run'
        blocked_envs:
          type: sequence
          label: 'Environment values that block execution'
          sequence:
            type: string
        env_var_names:
          type: sequence
          label: 'Environment variable names used to detect current env'
          sequence:
            type: string
        require_run_id_for_reset:
          type: boolean
          label: 'Require run ID to reset data'
    profiles:
      type: sequence
      label: 'Generation profiles'
      sequence:
        type: mapping
        mapping:
          bundle:
            type: string
            label: 'Node bundle'
          count:
            type: integer
            label: 'Node count'
          depth:
            type: integer
            label: 'Max paragraph nesting depth'
          paragraphs_per_node:
            type: mapping
            mapping:
              min:
                type: integer
              max:
                type: integer
          paragraph_types:
            type: sequence
            sequence:
              type: string
          taxonomy:
            type: mapping
            mapping:
              vocabulary:
                type: string
              terms_min:
                type: integer
              terms_max:
                type: integer
              create_if_missing:
                type: boolean
          media:
            type: mapping
            mapping:
              min:
                type: integer
              max:
                type: integer
              create_if_missing:
                type: boolean
              bundle:
                type: string

